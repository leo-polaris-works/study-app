<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'" />
<title>勉強記録</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- TOP -->
<section id="screen-top" class="screen" hidden>
  <h1>勉強記録</h1>

  <button class="sync-line" id="sync-line" type="button"></button>

  <button class="top-change" id="top-change" type="button" hidden></button>

  <div class="week-card" id="week-card">
    <div class="week-head">
      <h2>今週</h2>
      <span class="week-facts" id="week-facts"></span>
    </div>
    <div id="week-body"></div>
    <div class="week-more"><button class="btn btn-small btn-link" type="button">振り返りで見る ›</button></div>
  </div>

  <div class="menu">
    <button class="btn btn-primary btn-big" id="menu-record">学習記録</button>
    <button class="btn btn-menu" id="menu-records">学習記録を見る・直す</button>
    <button class="btn btn-menu" id="menu-review">振り返り</button>
  </div>

  <h3 class="menu-heading" id="admin-heading" hidden>管理用</h3>
  <div class="menu" id="admin-menu" hidden>
    <button class="btn btn-menu" id="menu-plan">学習計画</button>
    <button class="btn btn-menu" id="menu-settings">学習記録設定</button>
  </div>

  <div class="dev-tools" id="dev-tools" hidden>
    <p class="dev-tools-label">実機テスト用（本番では使わない）</p>
    <button class="btn btn-small" id="btn-seed-sample">サンプルデータを入れる</button>
    <button class="btn btn-small" id="btn-clear-sample">サンプルデータを消す</button>
  </div>
</section>

<!-- 振り返り：今週のまとめ・くわしく見る・わからなかったことノート -->
<section id="screen-review" class="screen" hidden>
  <button class="btn btn-back" data-goto="screen-top">← TOPへ</button>
  <h2>振り返り</h2>
  <div class="seg-group review-tabs" id="review-tabs"></div>
  <div id="review-panel-summary">
    <div class="week-nav">
      <button class="btn btn-small" id="btn-review-prev" type="button">‹</button>
      <span class="week-nav-label" id="review-week-label"></span>
      <button class="btn btn-small" id="btn-review-next" type="button">›</button>
    </div>
    <div id="review-summary-body"></div>
  </div>
  <div id="review-panel-detail" hidden>
    <div class="seg-group detail-period" id="detail-period"></div>
    <div class="week-nav">
      <button class="btn btn-small" id="btn-detail-prev" type="button">‹</button>
      <span class="week-nav-label" id="detail-range-label"></span>
      <button class="btn btn-small" id="btn-detail-next" type="button">›</button>
    </div>
    <div id="review-detail-body"></div>
  </div>
  <div id="review-panel-note" hidden>
    <h3 class="plan-heading">わからなかったことノート</h3>
    <div class="field-note" id="review-note-count"></div>
    <div class="seg-group" id="review-filter"></div>
    <div id="review-list"></div>
  </div>
</section>

<!-- 学習計画：一覧 -->
<section id="screen-plans" class="screen" hidden>
  <button class="btn btn-back" data-goto="screen-top">← TOPへ</button>
  <h2>学習計画</h2>
  <div id="plans-list"></div>
  <button class="btn btn-primary btn-big" id="btn-plan-new">新しい計画を作る</button>
</section>

<!-- 学習計画：編集 -->
<section id="screen-plan-edit" class="screen" hidden>
  <button class="btn btn-back" id="btn-plan-edit-back">← 戻る</button>
  <h2 id="plan-edit-title">計画を作る</h2>
  <div id="plan-edit-body"></div>
  <div class="field-warn" id="plan-edit-error" hidden></div>
  <button class="btn btn-primary btn-big" id="btn-plan-save">保存して計算する</button>
</section>

<!-- 学習計画：結果 -->
<section id="screen-plan-result" class="screen" hidden>
  <button class="btn btn-back" data-goto="screen-plans">← 一覧へ</button>
  <h2 id="plan-result-title"></h2>
  <div id="plan-result-body"></div>
  <button class="btn btn-big" id="btn-plan-edit">計画を直す</button>
  <button class="btn btn-big btn-danger" id="btn-plan-delete">削除する</button>
</section>

<!-- 入力（1項目1ページ。上部に現在地バー） -->
<section id="screen-input" class="screen screen-input" hidden>
  <button class="btn btn-back" id="btn-step-back">← 戻る</button>
  <ol class="stepper" id="stepper"></ol>
  <div id="step-body"></div>
</section>

<!-- 最近の記録（修正・削除） -->
<section id="screen-records" class="screen" hidden>
  <button class="btn btn-back" data-goto="screen-top">← TOPへ</button>
  <h2>最近の記録</h2>
  <div class="field-note" id="records-note">直近14日。タップすると、修正・削除できます</div>
  <div id="records-list"></div>
</section>

<section id="screen-record-detail" class="screen" hidden>
  <button class="btn btn-back" id="btn-detail-back">← 一覧へ</button>
  <h2 id="detail-title"></h2>
  <dl class="confirm-list" id="detail-list"></dl>
  <button class="btn btn-primary btn-big" id="btn-detail-edit">修正する</button>
  <button class="btn btn-big btn-danger" id="btn-detail-delete">削除する</button>
</section>

<!-- 登録結果 -->
<section id="screen-done" class="screen screen-done" hidden>
  <h2 id="done-title">登録しました</h2>
  <img id="done-illust" class="done-illust" alt="" hidden />
  <p class="done-message" id="done-message"></p>
  <p class="done-facts" id="done-facts"></p>
  <p class="done-sync" id="done-sync"></p>
  <button class="btn btn-primary btn-big" id="btn-done-again">続けて入力</button>
  <button class="btn btn-big" id="btn-done-top">TOPへ</button>
</section>

<!-- 学習記録設定 -->
<section id="screen-settings" class="screen" hidden>
  <button class="btn btn-back" data-goto="screen-top">← TOPへ</button>
  <h2>学習記録設定</h2>
  <div class="tabs" id="settings-tabs"></div>
  <div id="settings-body"></div>
</section>

<!-- 機能利用設定・鍵。鍵が使えない間は、この画面だけが開く（ロック） -->
<section id="screen-sync" class="screen" hidden>
  <button class="btn btn-back" id="btn-sync-back">← TOPへ</button>
  <h2 id="sync-title">機能利用設定</h2>
  <p class="lock-message" id="sync-lock-message" hidden></p>
  <div class="sync-status" id="sync-status"></div>

  <div id="sync-form">
    <div class="sync-section" id="sync-token-section">
      <h3 class="sync-heading">鍵</h3>
      <input class="sync-input" id="sync-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…" aria-label="鍵" />
      <div class="field-warn" id="sync-err-token" hidden></div>
    </div>

    <div class="sync-section">
      <h3 class="sync-heading">この端末の使い方</h3>
      <div class="seg-group" id="sync-mode"></div>
      <div class="field-warn" id="sync-err-mode" hidden></div>
    </div>

    <div class="sync-section">
      <h3 class="sync-heading">管理機能</h3>
      <div class="sync-help">学習計画・学習記録設定を、この端末で使うか。選ぶとすぐ反映されます</div>
      <div class="seg-group" id="sync-admin"></div>
    </div>

    <div class="field-warn" id="sync-err-connect" hidden></div>
    <button class="btn btn-primary btn-big" id="btn-sync-connect">つないで確認する</button>
  </div>

  <div id="sync-manage">
    <button class="btn btn-big" id="btn-sync-now">今すぐ同期</button>
    <button class="btn btn-big btn-danger" id="btn-sync-disconnect">鍵を消す</button>
  </div>
</section>

<!-- 今週がんばること（TOP・振り返りから開く） -->
<div class="dialog-backdrop" id="change-dialog" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="change-dialog-title">
    <div class="review-head">
      <h3 class="plan-heading" id="change-dialog-title">今週がんばること</h3>
      <button class="btn btn-small" id="btn-change-close" type="button">閉じる</button>
    </div>
    <div class="change-list" id="change-list"></div>
    <div class="change-free">
      <input class="plan-input change-input" id="change-input" type="text" autocomplete="off" aria-label="自分で書く" />
      <button class="btn btn-small" id="btn-change-free" type="button">決める</button>
    </div>
    <button class="btn btn-small btn-link" id="btn-change-clear" type="button">取り消す</button>
  </div>
</div>

<script src="config.js"></script>
<script src="master.js"></script>
<script src="data.js"></script>
<script src="plan.js"></script>
<script src="review.js"></script>
<script src="github.js"></script>
<script src="sync.js"></script>
<script src="messages.js"></script>
<script src="images.js"></script>
<script src="app.js"></script>
<script src="plan-ui.js"></script>
<script src="review-ui.js"></script>
<script src="review-detail-ui.js"></script>
</body>
</html>
