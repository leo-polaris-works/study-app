<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'" />
<title>勉強記録</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- TOP -->
<section id="screen-top" class="screen" hidden>
  <h1>勉強記録</h1>

  <button class="sync-line" id="sync-line" type="button"></button>

  <div class="week-card">
    <h2>今週</h2>
    <div class="week-numbers">
      <div><span id="week-total">0分</span><small>合計</small></div>
      <div><span id="week-days">0日</span><small>記録した日</small></div>
    </div>
    <div id="week-subjects"></div>
  </div>

  <div class="menu">
    <button class="btn btn-primary btn-big" id="menu-record">学習記録</button>
    <button class="btn btn-menu" id="menu-records">学習記録を見る・直す</button>
    <button class="btn btn-menu" id="menu-review">振り返り</button>
  </div>

  <h3 class="menu-heading" id="admin-heading" hidden>管理用</h3>
  <div class="menu" id="admin-menu" hidden>
    <button class="btn btn-menu" id="menu-plan">学習計画</button>
    <button class="btn btn-menu" id="menu-settings">学習記録設定</button>
  </div>

  <div class="dev-tools" id="dev-tools" hidden>
    <p class="dev-tools-label">実機テスト用（本番では使わない）</p>
    <button class="btn btn-small" id="btn-seed-sample">サンプルデータを入れる</button>
    <button class="btn btn-small" id="btn-clear-sample">サンプルデータを消す</button>
  </div>
</section>

<!-- 準備中（振り返り・学習計画） -->
<section id="screen-placeholder" class="screen" hidden>
  <button class="btn btn-back" data-goto="screen-top">← TOPへ</button>
  <h2 id="placeholder-title"></h2>
  <p>準備中です。記録の項目が固まってから作ります。</p>
</section>

<!-- 入力（1項目1ページ。上部に現在地バー） -->
<section id="screen-input" class="screen screen-input" hidden>
  <button class="btn btn-back" id="btn-step-back">← 戻る</button>
  <ol class="stepper" id="stepper"></ol>
  <div id="step-body"></div>
</section>

<!-- 最近の記録（修正・削除） -->
<section id="screen-records" class="screen" hidden>
  <button class="btn btn-back" data-goto="screen-top">← TOPへ</button>
  <h2>最近の記録</h2>
  <div class="field-note" id="records-note">直近14日。タップすると、修正・削除できます</div>
  <div id="records-list"></div>
</section>

<section id="screen-record-detail" class="screen" hidden>
  <button class="btn btn-back" id="btn-detail-back">← 一覧へ</button>
  <h2 id="detail-title"></h2>
  <dl class="confirm-list" id="detail-list"></dl>
  <button class="btn btn-primary btn-big" id="btn-detail-edit">修正する</button>
  <button class="btn btn-big btn-danger" id="btn-detail-delete">削除する</button>
</section>

<!-- 登録結果 -->
<section id="screen-done" class="screen screen-done" hidden>
  <h2 id="done-title">登録しました</h2>
  <img id="done-illust" class="done-illust" alt="" hidden />
  <p class="done-message" id="done-message"></p>
  <p class="done-facts" id="done-facts"></p>
  <p class="done-sync" id="done-sync"></p>
  <button class="btn btn-primary btn-big" id="btn-done-again">続けて入力</button>
  <button class="btn btn-big" id="btn-done-top">TOPへ</button>
</section>

<!-- 学習記録設定 -->
<section id="screen-settings" class="screen" hidden>
  <button class="btn btn-back" data-goto="screen-top">← TOPへ</button>
  <h2>学習記録設定</h2>
  <div class="tabs" id="settings-tabs"></div>
  <div id="settings-body"></div>
</section>

<!-- 機能利用設定・鍵。鍵が使えない間は、この画面だけが開く（ロック） -->
<section id="screen-sync" class="screen" hidden>
  <button class="btn btn-back" id="btn-sync-back">← TOPへ</button>
  <h2 id="sync-title">機能利用設定</h2>
  <p class="lock-message" id="sync-lock-message" hidden></p>
  <div class="sync-status" id="sync-status"></div>

  <div id="sync-form">
    <div class="sync-section" id="sync-token-section">
      <h3 class="sync-heading">鍵</h3>
      <input class="sync-input" id="sync-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…" aria-label="鍵" />
      <div class="field-warn" id="sync-err-token" hidden></div>
    </div>

    <div class="sync-section">
      <h3 class="sync-heading">この端末の使い方</h3>
      <div class="seg-group" id="sync-mode"></div>
      <div class="field-warn" id="sync-err-mode" hidden></div>
    </div>

    <div class="sync-section">
      <h3 class="sync-heading">管理機能</h3>
      <div class="sync-help">学習計画・学習記録設定を、この端末で使うか。選ぶとすぐ反映されます</div>
      <div class="seg-group" id="sync-admin"></div>
    </div>

    <div class="field-warn" id="sync-err-connect" hidden></div>
    <button class="btn btn-primary btn-big" id="btn-sync-connect">つないで確認する</button>
  </div>

  <div id="sync-manage">
    <button class="btn btn-big" id="btn-sync-now">今すぐ同期</button>
    <button class="btn btn-big btn-danger" id="btn-sync-disconnect">鍵を消す</button>
  </div>
</section>

<script src="config.js"></script>
<script src="master.js"></script>
<script src="data.js"></script>
<script src="github.js"></script>
<script src="sync.js"></script>
<script src="messages.js"></script>
<script src="images.js"></script>
<script src="app.js"></script>
</body>
</html>
